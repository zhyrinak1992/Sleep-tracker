name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Verify calendar analytics across DST
        env:
          TZ: Europe/Berlin
        run: flutter test test/sleep_dynamics_analysis_test.dart --reporter expanded
      - name: Verify physiological report calendar boundaries across DST
        env:
          TZ: Europe/Berlin
        run: flutter test test/health_report_service_test.dart --reporter expanded
      - name: Verify SQLite achievement metadata restore
        run: flutter test test/sleep_database_achievement_restore_test.dart --reporter expanded
      - name: Run tests
        run: flutter test --reporter expanded
