name: sleep_tracker
description: Локальный трекер сна для iPhone.
publish_to: "none"
version: 0.14.0+15

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  health: ^13.3.1
  record: ^6.0.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  flutter_local_timezone: ^1.0.0
  pdf: ^3.11.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
