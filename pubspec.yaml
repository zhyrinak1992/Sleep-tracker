name: sleep_tracker
description: Локальный трекер сна для iPhone.
publish_to: "none"
version: 0.22.0+23

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  health: ^14.0.0
  record: ^6.0.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  flutter_local_timezone: ^1.0.0
  pdf: ^3.11.3
  audioplayers: ^6.1.0
  archive: ^3.6.1
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  xml: ^6.5.0
  http: ^1.3.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0

dependency_overrides:
  # device_info_plus 12.4.0 requires Xcode 26.1+; keep compatibility with current macos-15 runner.
  device_info_plus: 12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
